server {
    listen 80;
    root /usr/share/nginx/html;

    location ~ ^/[A-Za-z0-9]\{6\}$ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $http_host;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $http_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
